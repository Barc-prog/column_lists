<!-- index.html (STABLE FIX v2) -->
<!--
  NOTE: Keep manifest.json as a SEPARATE FILE at repo root.
  Do NOT append raw JSON below the HTML — that can break parsing on some hosts.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Column Lists — Web App</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--bg:#f7f7f8;--ink:#1f2937;--muted:#6b7280;--panel:#ffffff;--border:#e5e7eb;--accent:#2563eb}
    [data-theme="dark"]{--bg:#0b1020;--ink:#e5e7eb;--muted:#9ca3af;--panel:#0f172a;--border:#1f2937;--accent:#60a5fa}
    [data-theme="hc"]{--bg:#ffffff;--ink:#000000;--muted:#000000;--panel:#ffffff;--border:#000000;--accent:#000000}
    html,body{height:100%;margin:0;font:14px system-ui;background:var(--bg);color:var(--ink)}
    .appbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10}
    .spacer{flex:1}
    .input{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--panel);color:var(--ink);max-width:100%}
    .btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink)}
    .btn:hover{filter:brightness(1.02)}
    .columns{display:flex;gap:12px;padding:12px;overflow:auto;height:calc(100% - 62px)}
    .column{flex:0 0 280px;width:280px;background:var(--panel);border:1px solid var(--border);border-radius:12px;flex-shrink:0;display:flex;max-height:100%}
    .col-inner{display:flex;flex-direction:column;gap:8px;padding:8px;flex:1;min-height:0;min-width:0}
    .col-head{display:flex;align-items:center;gap:6px;cursor:grab}
    .col-title{font-weight:600;flex:1;border:1px dashed transparent;padding:2px 4px;border-radius:6px}
    .col-title[contenteditable="true"]{border-color:var(--border);background:rgba(0,0,0,.02)}
    .col-body{overflow:auto;min-height:40px}
    .col-footer{display:flex;gap:6px}
    .col-footer .input:first-child{flex:1;min-width:0}
    .item{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px;margin-bottom:6px;cursor:grab;white-space:normal;overflow-wrap:anywhere}
    .placeholder{height:40px;border:2px dashed var(--border);margin-bottom:6px;border-radius:8px}
    .col-placeholder{width:280px;height:120px;border:2px dashed var(--border);border-radius:12px;flex-shrink:0}
    .ghost{opacity:.6;pointer-events:none;position:fixed;left:0;top:0;transform:translate(var(--gx,0), var(--gy,0))}
  </style>
</head>
<body>
  <div class="appbar">
    <strong>Column Lists</strong>
    <input id="newColName" class="input" placeholder="New column name" />
    <button id="addColBtn" class="btn">+ Column</button>
    <span class="spacer"></span>
    <div class="seg">
      <button id="lightBtn" class="btn" title="Light theme">Light</button>
      <button id="darkBtn" class="btn" title="Dark theme">Dark</button>
      <button id="hcBtn" class="btn" title="High-contrast theme">HC</button>
    </div>
    <button id="exportBtn" class="btn">Export</button>
    <label class="btn" for="importFile">Import<input id="importFile" type="file" accept="application/json" style="display:none" /></label>
  </div>
  <div class="columns" id="columns"></div>
<script>
/* =====================
   STATE (localStorage)
===================== */
const STORAGE='clists.v3';
const load=()=>{try{const r=localStorage.getItem(STORAGE);return r?JSON.parse(r):null;}catch(e){return null}};
const save=()=>localStorage.setItem(STORAGE,JSON.stringify(state));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

let state=load()||{
  settings:{theme:'light'},
  columns:[
    {id:uid(), title:'Today', items:[{id:uid(), text:'Sample 1'},{id:uid(), text:'Sample 2'}]},
    {id:uid(), title:'Grocery', items:[]},
    {id:uid(), title:'Projects', items:[]},
    {id:uid(), title:'Fun Ideas', items:[]},
    {id:uid(), title:'Baby', items:[]},
    {id:uid(), title:'House/Family', items:[]},
    {id:uid(), title:'Backlog', items:[]}
  ]
};
applyTheme(state.settings.theme||'light');

/* =====================
   RENDER
===================== */
const columnsEl=document.getElementById('columns');
function render(){
  columnsEl.innerHTML='';
  state.columns.forEach(function(col){
    const wrap=el('div','column'); wrap.dataset.colId=col.id; enableColumnDrag(wrap);
    const inner=el('div','col-inner');

    // Header
    const head=el('div','col-head'); head.dataset.handle='col-drag';
    const title=el('div','col-title'); title.textContent=col.title; title.title='Click to rename';
    title.addEventListener('click',function(){ makeEditable(title, function(v){ col.title=v||'Untitled'; save(); }); });
    const del=el('button','btn'); del.textContent='Del'; del.addEventListener('click',function(){
      if(state.columns.length<=1){ alert('Keep at least one column.'); return; }
      const msg=(col.items&&col.items.length)?('Delete column "'+col.title+'" and move '+col.items.length+' item(s) to Backlog?'):('Delete column "'+col.title+'"?');
      if(confirm(msg)) deleteColumn(col.id);
    });
    head.append(title,del);

    // Body
    const body=el('div','col-body'); body.dataset.colId=col.id;
    col.items.forEach(function(it){ body.appendChild(renderItem(col.id,it)); });

    // Footer (add)
    const foot=el('div','col-footer');
    const inp=el('input','input'); inp.placeholder='Add item…'; inp.autocomplete='off'; inp.autocapitalize='sentences'; inp.spellcheck=true;
    const add=el('button','btn'); add.textContent='+';
    // Keep focus in input when clicking button
    add.addEventListener('mousedown',function(e){ e.preventDefault(); });
    function addAndStay(){
      const txt=inp.value.trim(); if(!txt) return;
      addItem(col.id, txt);
      inp.value=''; inp.focus();
    }
    add.addEventListener('click',addAndStay);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addAndStay(); }});
    foot.append(inp,add);

    inner.append(head,body,foot); wrap.appendChild(inner); columnsEl.appendChild(wrap);
  });
}

function renderItem(colId,item){
  const d=el('div','item'); d.textContent=item.text; d.dataset.itemId=item.id; d.dataset.colId=colId;
  if(item.divider){ d.style.fontWeight='600'; d.style.background='#e0e7ff'; d.style.cursor='default'; }
  else { enableItemDrag(d); }
  return d;
}

/* =====================
   OPERATIONS
===================== */
document.getElementById('addColBtn').addEventListener('click',function(){
  const name=document.getElementById('newColName').value.trim();
  if(!name) return; state.columns.push({id:uid(), title:name, items:[]}); save(); render(); document.getElementById('newColName').value='';
});
function addItem(colId,text){
  const col=state.columns.find(function(c){ return c.id===colId; }); if(!col) return;
  const item={id:uid(), text:text}; col.items.push(item); save();
  // Incrementally append to avoid re-render focus loss
  const body=document.querySelector('.column[data-col-id="'+colId+'"] .col-body');
  if(body) body.appendChild(renderItem(colId,item));
}
function getOrCreateBacklog(excludeId){
  var existing=state.columns.find(function(c){ return c.title==='Backlog' && c.id!==excludeId; });
  if(existing) return existing;
  var created={id:uid(), title:'Backlog', items:[]}; state.columns.push(created); return created;
}
function deleteColumn(colId){
  var idx=state.columns.findIndex(function(c){ return c.id===colId; }); if(idx===-1) return;
  if(state.columns.length<=1){ alert('Keep at least one column.'); return; }
  var col=state.columns[idx];
  if(col.items && col.items.length){
    var fb=getOrCreateBacklog(colId);
    var divider={id:uid(), text:'From: '+col.title, divider:true};
    fb.items.unshift(divider);
    for(var i=col.items.length-1;i>=0;i--){ fb.items.unshift(col.items[i]); }
  }
  state.columns.splice(idx,1); save(); render();
}

/* =====================
   DRAG: items between/within columns
===================== */
let dragItem=null, ghost=null, placeholder=null;
function enableItemDrag(el){
  el.addEventListener('pointerdown',function(e){ if(e.button!==0) return; dragItem=e.currentTarget; dragItem.setPointerCapture(e.pointerId);
    placeholder=document.createElement('div'); placeholder.className='placeholder'; dragItem.parentElement.insertBefore(placeholder, dragItem.nextSibling);
    ghost=dragItem.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); updateGhost(e);
  });
  el.addEventListener('pointermove',function(e){ if(!dragItem) return; updateGhost(e);
    const bodies=[].slice.call(document.querySelectorAll('.col-body'));
    const target=bodies.find(function(b){ const r=b.getBoundingClientRect(); return inRect(r,e.clientX,e.clientY); });
    if(target){
      if(placeholder.parentElement!==target) target.appendChild(placeholder);
      const items=[].slice.call(target.querySelectorAll('.item')).filter(function(n){ return n!==dragItem; });
      var placed=false; for(var i=0;i<items.length;i++){ const sib=items[i]; const r=sib.getBoundingClientRect(); if(decideInsert(e.clientY,r.top,r.height)==='before'){ target.insertBefore(placeholder,sib); placed=true; break; } }
      if(!placed) target.appendChild(placeholder);
    }
  });
  el.addEventListener('pointerup',function(e){ if(!dragItem) return; dragItem.releasePointerCapture(e.pointerId);
    const targetBody=placeholder.parentElement; if(targetBody) targetBody.insertBefore(dragItem, placeholder);
    if(placeholder) placeholder.remove(); if(ghost) ghost.remove();
    const newColId=targetBody && targetBody.dataset.colId; const oldColId=el.dataset.colId;
    if(newColId){
      if(newColId!==oldColId){
        const oldCol=state.columns.find(function(c){ return c.id===oldColId; });
        const moved=oldCol.items.find(function(i){ return i.id===el.dataset.itemId; });
        oldCol.items=oldCol.items.filter(function(i){ return i.id!==moved.id; });
        const newCol=state.columns.find(function(c){ return c.id===newColId; });
        const order=[].slice.call(targetBody.querySelectorAll('.item')).map(function(n){ return n.dataset.itemId; });
        const idx=order.indexOf(moved.id); newCol.items.splice(idx,0,moved); el.dataset.colId=newColId;
      } else {
        const col=state.columns.find(function(c){ return c.id===newColId; });
        const order=[].slice.call(targetBody.querySelectorAll('.item')).map(function(n){ return n.dataset.itemId; });
        col.items = order.map(function(id){ return col.items.find(function(x){ return x.id===id; }); });
      }
    }
    dragItem=null; ghost=null; placeholder=null; save(); render();
  });
}
function updateGhost(e){ if(ghost){ ghost.style.setProperty('--gx', e.clientX+'px'); ghost.style.setProperty('--gy', e.clientY+'px'); } }
function inRect(r,x,y){ return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom }
function decideInsert(py, top, h){ return (py <= top + h/2) ? 'before' : 'after'; }

/* =====================
   DRAG: reorder columns
===================== */
let dragCol=null, ghostCol=null, colPh=null;
function enableColumnDrag(columnEl){
  const handle=columnEl.querySelector('[data-handle="col-drag"]')||columnEl;
  handle.addEventListener('pointerdown',function(e){ if(e.button!==0) return; dragCol=columnEl; dragCol.setPointerCapture(e.pointerId);
    colPh=document.createElement('div'); colPh.className='col-placeholder'; columnEl.parentElement.insertBefore(colPh, columnEl.nextSibling);
    ghostCol=columnEl.cloneNode(true); ghostCol.classList.add('ghost'); document.body.appendChild(ghostCol); updateGhost(e);
  });
  handle.addEventListener('pointermove',function(e){ if(!dragCol) return; updateGhost(e);
    const siblings=[].slice.call(document.querySelectorAll('.columns > .column')).filter(function(n){ return n!==dragCol; });
    var placed=false; for(var i=0;i<siblings.length;i++){ var sib=siblings[i]; var r=sib.getBoundingClientRect(); if(e.clientX <= r.left + r.width/2){ sib.parentElement.insertBefore(colPh, sib); placed=true; break; } }
    if(!placed){ const cont=document.querySelector('.columns'); cont.appendChild(colPh); }
  });
  handle.addEventListener('pointerup',function(e){ if(!dragCol) return; dragCol.releasePointerCapture(e.pointerId);
    colPh.parentElement.insertBefore(dragCol, colPh); colPh.remove(); if(ghostCol) ghostCol.remove();
    const ids=[].slice.call(document.querySelectorAll('.columns > .column')).map(function(n){ return n.dataset.colId; });
    state.columns = ids.map(function(id){ return state.columns.find(function(c){ return c.id===id; }); }); save(); render();
    dragCol=null; ghostCol=null; colPh=null;
  });
}

/* =====================
   THEME + UTIL
===================== */
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); state.settings.theme=t; save(); }
['light','dark','hc'].forEach(function(m){ document.getElementById(m+'Btn').addEventListener('click',function(){ applyTheme(m); }); });
function el(tag, cls){ var d=document.createElement(tag); if(cls) d.className=cls; return d }
function makeEditable(node,onDone){ node.setAttribute('contenteditable','true'); node.focus(); var handler=function(e){ if(e.key==='Enter'){ e.preventDefault(); node.removeAttribute('contenteditable'); node.removeEventListener('keydown',handler); if(onDone) onDone(node.textContent.trim()); save(); } }; node.addEventListener('keydown',handler); }

/* =====================
   SELF-TESTS (non-breaking)
===================== */
(function(){
  try{
    // Existing tests
    console.assert(decideInsert(100,80,40)==='before','midpoint before');
    console.assert(decideInsert(79,80,40)==='before','above before');
    console.assert(decideInsert(121,80,40)==='after','below after');

    // addItem appends (non-destructive)
    const backup=JSON.stringify(state);
    addItem(state.columns[0].id,'__test__');
    const last=state.columns[0].items[state.columns[0].items.length-1];
    console.assert(last && last.text==='__test__','addItem appends');

    // NEW TESTS: deleteColumn moves items to Backlog with divider
    (function(){
      const S={settings:{theme:'light'}, columns:[
        {id:'c1', title:'Alpha', items:[{id:'i1',text:'one'},{id:'i2',text:'two'}]},
        {id:'c2', title:'Backlog', items:[]}
      ]};
      function _getOrCreateBacklog(ex){var f=S.columns.find(c=>c.title==='Backlog'&&c.id!==ex);if(f)return f;const n={id:'nb',title:'Backlog',items:[]};S.columns.push(n);return n}
      function _del(id){const ix=S.columns.findIndex(c=>c.id===id);if(ix===-1)return;const col=S.columns[ix];if(col.items&&col.items.length){const fb=_getOrCreateBacklog(id);fb.items.unshift({id:'d',text:'From: '+col.title,divider:true});for(let k=col.items.length-1;k>=0;k--)fb.items.unshift(col.items[k]);}S.columns.splice(ix,1)}
      _del('c1');
      const bl=S.columns.find(c=>c.title==='Backlog');
      console.assert(bl.items.length===3,'two items + divider moved');
      console.assert(bl.items[0].divider===true && bl.items[0].text.indexOf('From:')===0,'divider present at top');
    })();

    // NEW TEST: deleting Backlog itself recreates Backlog and preserves items
    (function(){
      const S={settings:{theme:'light'}, columns:[
        {id:'a', title:'Alpha', items:[]},
        {id:'b', title:'Backlog', items:[{id:'x',text:'keep'}]}
      ]};
      function _getOrCreateBacklog(ex){var f=S.columns.find(c=>c.title==='Backlog'&&c.id!==ex);if(f)return f;const n={id:'nb',title:'Backlog',items:[]};S.columns.push(n);return n}
      function _del(id){const ix=S.columns.findIndex(c=>c.id===id);if(ix===-1)return;const col=S.columns[ix];if(col.items&&col.items.length){const fb=_getOrCreateBacklog(id);fb.items.unshift({id:'d',text:'From: '+col.title,divider:true});for(let k=col.items.length-1;k>=0;k--)fb.items.unshift(col.items[k]);}S.columns.splice(ix,1)}
      _del('b');
      const bl=S.columns.find(c=>c.title==='Backlog');
      console.assert(!!bl,'Backlog exists after deletion');
      console.assert(bl.items.some(i=>i.text==='keep'),'item preserved');
    })();

    // restore
    state=JSON.parse(backup); save(); render();
    console.log('%cSelf-tests passed','color:green');
  }catch(err){ console.error('Self-tests failed', err); }
})();

// Boot
render();
</script>
</body>
</html>
